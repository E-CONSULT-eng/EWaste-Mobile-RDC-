<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWaste Mobile RDC</title>

  <!-- 🔗 Lien vers le manifest -->
  <link rel="manifest" href="manifestation.json">

  <!-- ⚙️ Enregistrement du service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker enregistré"))
        .catch(error => console.error("Erreur Service Worker:", error));
    }
  </script>
</head>
<body>
  <h1>Bienvenue sur EWaste Mobile RDC</h1>
  <p>Application de gestion durable des déchets.</p>
</body>
</html>
